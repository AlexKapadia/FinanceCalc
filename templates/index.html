<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinanceCalc Hub - Hedge Fund Tools</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f0f2f5, #d9e4f5);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-top: 70px;
    }
    .calculator-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 25px;
      margin: 20px auto;
      max-width: 900px;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.2em;
      color: #2c3e50;
    }
    .nav-tabs .nav-link.active {
      background-color: #007bff;
      color: white;
      border: none;
    }
    .nav-tabs .nav-link {
      border: none;
      color: #007bff;
      font-weight: bold;
    }
    table {
      margin-top: 10px;
    }
    .term-info {
      cursor: help;
      color: #007bff;
      margin-left: 5px;
    }
    .term-modal .modal-body {
      max-height: 70vh;
      overflow-y: auto;
    }
    .term-formula {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
      font-family: monospace;
    }
    .term-interpretation {
      background-color: #e9ecef;
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <!-- Fixed Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">FinanceCalc Hub</a>
    </div>
  </nav>

  <div class="container">
    <!-- Tabs Navigation -->
    <ul class="nav nav-tabs mb-4" id="calculatorTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="compound-tab" data-bs-toggle="tab" data-bs-target="#compound" type="button" role="tab" aria-controls="compound" aria-selected="false">
          Compound Interest
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="montecarlo-tab" data-bs-toggle="tab" data-bs-target="#montecarlo" type="button" role="tab" aria-controls="montecarlo" aria-selected="true">
          Monte Carlo Simulation
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Compound Interest Calculator (Example) -->
      <div class="tab-pane fade calculator-container" id="compound" role="tabpanel" aria-labelledby="compound-tab">
        <h3 class="mb-3">Compound Interest Calculator</h3>
        <form id="compoundForm">
          <!-- Form fields as before -->
          <div class="mb-3">
            <label for="principal" class="form-label">Principal Amount ($):</label>
            <input type="number" class="form-control" id="principal" placeholder="e.g., 1000" required />
          </div>
          <div class="mb-3">
            <label for="rate" class="form-label">Annual Interest Rate (%):</label>
            <input type="number" step="0.01" class="form-control" id="rate" placeholder="e.g., 5" required />
          </div>
          <div class="mb-3">
            <label for="times" class="form-label">Times Compounded Per Year:</label>
            <input type="number" class="form-control" id="times" placeholder="e.g., 12" value="12" required />
          </div>
          <div class="mb-3">
            <label for="years" class="form-label">Number of Years:</label>
            <input type="number" class="form-control" id="years" placeholder="e.g., 10" required />
          </div>
          <button type="submit" class="btn btn-primary">Calculate</button>
        </form>
        <div id="compoundResult" class="result"></div>
      </div>

      <!-- Monte Carlo Simulation Tab -->
      <div class="tab-pane fade show active calculator-container" id="montecarlo" role="tabpanel" aria-labelledby="montecarlo-tab">
        <h3 class="mb-3">Monte Carlo Portfolio Simulation</h3>
        <form id="monteForm">
          <div class="mb-3">
            <label for="tickers" class="form-label">Tickers (comma separated):</label>
            <input type="text" class="form-control" id="tickers" placeholder="e.g., AAPL, MSFT, GOOGL" required />
          </div>
          <div class="mb-3">
            <label for="amounts" class="form-label">Investment Amounts (comma separated, USD):</label>
            <input type="text" class="form-control" id="amounts" placeholder="e.g., 10000, 15000, 12000" required />
          </div>
          <button type="submit" class="btn btn-primary">Run Simulation</button>
        </form>
        <div id="monteResult" class="mt-3">
          <!-- Simulation results, portfolio statistics, index stats, and comparison will be displayed here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Add Modal for Term Details -->
  <div class="modal fade" id="termModal" tabindex="-1" aria-labelledby="termModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="termModalLabel">Term Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <h4 id="termName"></h4>
          <p id="termDefinition"></p>
          <div class="term-formula">
            <strong>Formula:</strong>
            <p id="termFormula"></p>
          </div>
          <div class="term-interpretation">
            <strong>Interpretation:</strong>
            <p id="termInterpretation"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let financialTerms = {};

    function showTermDetails(termKey) {
      const term = financialTerms[termKey];
      if (term) {
        document.getElementById('termName').textContent = term.term;
        document.getElementById('termDefinition').textContent = term.definition;
        document.getElementById('termFormula').textContent = term.formula;
        document.getElementById('termInterpretation').textContent = term.interpretation;
        new bootstrap.Modal(document.getElementById('termModal')).show();
      }
    }

    function createTermInfoButton(termKey) {
      return `<span class="term-info" onclick="showTermDetails('${termKey}')" title="Click for more info">ⓘ</span>`;
    }

    // Function to format portfolio statistics into HTML tables
    function formatPortfolioStats(stats) {
      let html = '<h5>Portfolio Statistics</h5>';
      html += '<table class="table table-bordered table-striped">';
      html += '<thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>';
      html += `<tr><td>Expected Daily Return${createTermInfoButton('expected_daily_return')}</td><td>${(stats.expected_daily_return * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Daily Volatility${createTermInfoButton('volatility_daily')}</td><td>${(stats.volatility_daily * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Expected Annual Return${createTermInfoButton('expected_annual_return')}</td><td>${(stats.expected_annual_return * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Annual Volatility${createTermInfoButton('annual_volatility')}</td><td>${(stats.annual_volatility * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Diversification Ratio${createTermInfoButton('diversification_ratio')}</td><td>${stats.diversification_ratio.toFixed(4)}</td></tr>`;
      
      // Risk Metrics
      if (stats.sharpe_ratio !== undefined) {
        html += `<tr><td>Sharpe Ratio${createTermInfoButton('sharpe_ratio')}</td><td>${stats.sharpe_ratio.toFixed(2)}</td></tr>`;
      }
      if (stats.sortino_ratio !== undefined) {
        html += `<tr><td>Sortino Ratio${createTermInfoButton('sortino_ratio')}</td><td>${stats.sortino_ratio.toFixed(2)}</td></tr>`;
      }
      if (stats.max_drawdown !== undefined) {
        html += `<tr><td>Maximum Drawdown${createTermInfoButton('max_drawdown')}</td><td>${(stats.max_drawdown * 100).toFixed(2)}%</td></tr>`;
      }
      if (stats.var_95 !== undefined) {
        html += `<tr><td>95% Value at Risk${createTermInfoButton('var_95')}</td><td>${(stats.var_95 * 100).toFixed(2)}%</td></tr>`;
      }
      if (stats.var_99 !== undefined) {
        html += `<tr><td>99% Value at Risk${createTermInfoButton('var_99')}</td><td>${(stats.var_99 * 100).toFixed(2)}%</td></tr>`;
      }
      if (stats.cvar_95 !== undefined) {
        html += `<tr><td>95% Conditional VaR${createTermInfoButton('cvar_95')}</td><td>${(stats.cvar_95 * 100).toFixed(2)}%</td></tr>`;
      }
      if (stats.cvar_99 !== undefined) {
        html += `<tr><td>99% Conditional VaR${createTermInfoButton('cvar_99')}</td><td>${(stats.cvar_99 * 100).toFixed(2)}%</td></tr>`;
      }
      if (stats.information_ratio !== undefined) {
        html += `<tr><td>Information Ratio${createTermInfoButton('information_ratio')}</td><td>${stats.information_ratio.toFixed(2)}</td></tr>`;
      }
      if (stats.calmar_ratio !== undefined) {
        html += `<tr><td>Calmar Ratio${createTermInfoButton('calmar_ratio')}</td><td>${stats.calmar_ratio.toFixed(2)}</td></tr>`;
      }
      if (stats.risk_free_rate !== undefined) {
        html += `<tr><td>Risk-Free Rate${createTermInfoButton('risk_free_rate')}</td><td>${(stats.risk_free_rate * 100).toFixed(2)}%</td></tr>`;
      }
      html += '</tbody></table>';

      if (stats.optimal_portfolio) {
        html += '<h5>Optimal Portfolio Weights' + createTermInfoButton('optimal_portfolio') + '</h5>';
        html += '<table class="table table-bordered table-striped">';
        html += '<thead><tr><th>Asset</th><th>Weight</th></tr></thead><tbody>';
        for (const [asset, weight] of Object.entries(stats.optimal_portfolio.optimal_weights)) {
          html += `<tr><td>${asset}</td><td>${(weight * 100).toFixed(2)}%</td></tr>`;
        }
        html += '</tbody></table>';
      }

      function matrixToTable(matrix, title, infoKey) {
        let keys = Object.keys(matrix);
        let tableHtml = `<h5>${title}${createTermInfoButton(infoKey)}</h5>`;
        tableHtml += '<table class="table table-bordered table-striped"><thead><tr><th></th>';
        keys.forEach(function(key) {
          tableHtml += `<th>${key}</th>`;
        });
        tableHtml += '</tr></thead><tbody>';
        keys.forEach(function(rowKey) {
          tableHtml += `<tr><th>${rowKey}</th>`;
          keys.forEach(function(colKey) {
            tableHtml += `<td>${matrix[rowKey][colKey]}</td>`;
          });
          tableHtml += '</tr>';
        });
        tableHtml += '</tbody></table>';
        return tableHtml;
      }
      html += matrixToTable(stats.covariance_matrix, "Covariance Matrix", "covariance_matrix");
      html += matrixToTable(stats.correlation_matrix, "Correlation Matrix", "correlation_matrix");
      return html;
    }

    function formatIndexStats(stats) {
      let html = '<h5>S&P 500 Statistics</h5>';
      html += '<table class="table table-bordered table-striped">';
      html += '<thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>';
      html += `<tr><td>Expected Daily Return${createTermInfoButton('expected_daily_return')}</td><td>${(stats.expected_daily_return * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Daily Volatility${createTermInfoButton('volatility_daily')}</td><td>${(stats.volatility_daily * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Expected Annual Return${createTermInfoButton('expected_annual_return')}</td><td>${(stats.expected_annual_return * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Annual Volatility${createTermInfoButton('annual_volatility')}</td><td>${(stats.annual_volatility * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Sharpe Ratio${createTermInfoButton('sharpe_ratio')}</td><td>${stats.sharpe_ratio.toFixed(2)}</td></tr>`;
      html += '</tbody></table>';
      return html;
    }

    function formatComparison(comp) {
      let html = '<h5>Portfolio vs. S&P 500 Comparison</h5>';
      html += '<table class="table table-bordered table-striped">';
      html += '<thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>';
      html += `<tr><td>Beta${createTermInfoButton('beta')}</td><td>${comp.beta.toFixed(2)}</td></tr>`;
      html += `<tr><td>Alpha (Daily)${createTermInfoButton('alpha')}</td><td>${(comp.alpha_daily * 100).toFixed(2)}%</td></tr>`;
      html += `<tr><td>Alpha (Annual)${createTermInfoButton('alpha')}</td><td>${(comp.alpha_annual * 100).toFixed(2)}%</td></tr>`;
      html += '</tbody></table>';
      return html;
    }

    // Monte Carlo Simulation Form Handler
    document.getElementById('monteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('monteResult').innerHTML = '<p>Running simulation, please wait...</p>';
      let tickers = document.getElementById('tickers').value.split(',').map(s => s.trim()).filter(s => s !== '');
      let amounts = document.getElementById('amounts').value.split(',').map(s => parseFloat(s.trim())).filter(s => !isNaN(s));
      if (tickers.length !== amounts.length) {
        alert("The number of tickers and amounts must match.");
        return;
      }
      fetch('/simulate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tickers: tickers, amounts: amounts })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          document.getElementById('monteResult').innerHTML = '<p>Error: ' + data.error + '</p>';
        } else {
          financialTerms = data.financial_terms;
          let img1 = '<h5>Simulation Paths</h5><img src="data:image/png;base64,' + data.plot1 + '" class="img-fluid" />';
          let img2 = '<h5>Mean Path & Best Fit Line</h5><img src="data:image/png;base64,' + data.plot2 + '" class="img-fluid" />';
          if (data.plot3) {
            img2 += '<h5>Efficient Frontier' + createTermInfoButton('efficient_frontier') + '</h5><img src="data:image/png;base64,' + data.plot3 + '" class="img-fluid" />';
          }
          let portStatsHtml = formatPortfolioStats(data.portfolio_stats);
          let indexStatsHtml = formatIndexStats(data.index_stats);
          let compHtml = formatComparison(data.portfolio_comparison);
          document.getElementById('monteResult').innerHTML = img1 + '<br>' + img2 + '<br>' + portStatsHtml + '<br>' + indexStatsHtml + '<br>' + compHtml;
        }
      })
      .catch(err => {
        document.getElementById('monteResult').innerHTML = '<p>Error running simulation.</p>';
      });
    });
  </script>
</body>
</html>
